<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="I Am The Needle">
  <defs>
    <linearGradient id="hex-grad" gradientUnits="userSpaceOnUse" x1="4.45" y1="50" x2="95.55" y2="50">
      <stop offset="0" stop-color="#6F15D3"/>
      <stop offset="0.25" stop-color="#AA17B6"/>
      <stop offset="0.5" stop-color="#F82576"/>
      <stop offset="0.75" stop-color="#FA5C38"/>
      <stop offset="1" stop-color="#FA8905"/>
    </linearGradient>
  </defs>

  <!-- Rounded hexagon: the path is inset by the corner radius, then stroked
       at twice that radius with round joins, which rounds all six corners. -->
  <path d="M 50 6.89 L 89.55 29.17 L 89.55 70.83 L 50 93.11 L 10.45 70.83 L 10.45 29.17 Z"
        fill="url(#hex-grad)"
        stroke="url(#hex-grad)"
        stroke-width="12"
        stroke-linejoin="round"/>
</svg>
