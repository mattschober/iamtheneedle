# Writes the latest posts from @migratewithmatt into index.html and commits the result.
#
# Credentials come from repository secrets: X_BEARER_TOKEN if it is set, otherwise
# X_CONSUMER_KEY and X_SECRET_KEY, which the job exchanges for an app-only bearer
# token at run time. With neither, the job fails loudly rather than publishing a
# stale or empty feed.
name: Refresh X feed

on:
  schedule:
    # Nightly. 08:47 UTC is 03:47 in Minneapolis on CDT, 02:47 on CST -- the middle
    # of the night either way. Off the hour, since GitHub's scheduler is busiest there.
    - cron: '47 8 * * *'
  workflow_dispatch:

concurrency:
  group: x-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 starting
    # 2026-10-19, and a nightly job that nobody watches should not change OS under
    # itself. Bump this deliberately once Ubuntu 26 images have settled.
    runs-on: ubuntu-24.04
    steps:
      # v5 of both actions runs on the Node 24 action runtime. Node 20 was removed
      # from the runners in September 2026, so v4 only survives by being forced
      # onto Node 24 anyway, with a deprecation warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch posts and rewrite index.html
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_SECRET_KEY: ${{ secrets.X_SECRET_KEY }}
          X_USERNAME: migratewithmatt
          # No X_POST_COUNT: the number of post slots in index.html sets it, so the
          # page and the fetch cannot drift apart.
        run: node scripts/fetch-x-posts.mjs

      - name: Commit if the feed changed
        run: |
          if [ -z "$(git status --porcelain index.html posts.json)" ]; then
            echo "Feed unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.json
          git commit -m "Refresh X feed from @migratewithmatt"
          git push
